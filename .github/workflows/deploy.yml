name: Build and publish

# Builds the container on GitHub Actions. On main and release tags it pushes the image to
# Artifact Registry (europe-west1-docker.pkg.dev/mawadao/mawadao/maava-api).
# Pull requests only build. See https://github.com/maavadao/.github/tree/main/.github/workflows

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  image:
    uses: maavadao/.github/.github/workflows/cloud-run.yml@main
    with:
      image: maava-api
